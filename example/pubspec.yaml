name: mindful_minutes_example

description: Demonstrates how to use the mindful_minutes plugin.

version: 1.0.0+1

publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  mindful_minutes:
    path: ../

dev_dependencies:
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: true
